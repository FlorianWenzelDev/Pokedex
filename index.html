<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./assets/icons/pokeball_sprite.svg" type="image/x-icon">
    <title>Pokedex</title>
    <link rel="stylesheet" href="./styles/standard.css">
    <link rel="stylesheet" href="./styles/fonts.css">
    <link rel="stylesheet" href="style.css">
    <script src="./script.js"></script>
    <script src="./scripts/templates.js"></script>
</head>

<body onload="init()">
    <header class="site-header">
        <div class="header-styling-wrapper">
            <img class="site-logo" src="./assets/icons/pokeball_sprite.svg" alt="black lined pokeball">
            <h1>Pokedex</h1>
        </div>
        <div class="header-styling-wrapper">
            <input oninput="enableSearchButton()" onkeyup="searchWithEnter(event)" id="searchInput"
                data-id="search-input" type="text" placeholder="Search here...">
            <button onclick="searchForPokemons()" data-id="search-button" id="searchBtn" class="search-btn">Search</button>
        </div>
    </header>
    <main data-id="content" id="mainContent">
        <ul id="listOfPokemon" class="list-of-pokemon">
        </ul>
        <button data-id="load-more-button" class="load-more-button" id="loadMoreButton" onclick="callLoadingFunctions()">Load more</button>
    </main>
    <section class="loading-screen" id="loadingScreen">
        <img src="./assets/icons/pokeball_sprite.svg" alt="black lined pokeball">
        <p>Loading content...</p>
    </section>
    <footer class="site-footer">
        <a href="imprint.html">Imprint</a>
        <div class="copyright">
            <img src="./assets/icons/copyright.svg" alt="copyrighticon">
            <p>Florian Wenzel</p>
        </div>
    </footer>
    <dialog aria-label="Detailed pokemon view" data-id="dialog" class="pokemon-dialog" id="pokemonDialog" closedby="any">
    </dialog>   
</body>

</html>
